<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#161b22">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Trading Journal">

    <title>Edit Trade</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header class="main-header">

    <div class="brand">

        <a
            href="index.html"
            class="brand-link"
        >
        <img
            src="icons/logo.png"
            alt="Trading Journal Logo"
            class="brand-logo"
        >


            <h1>
                Trading Journal
            </h1>

        </a>

        <span class="subtitle">
            Performance & Risk Dashboard
        </span>

    </div>


    <div class="header-actions">

        <a
            href="add-trade.html"
            class="add-trade-button"
        >
            + Add Trade
        </a>

        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<nav class="main-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>
    <a href="risk-calculator.html">
    Risk Calculator
</a>

</nav>
<header>


<main>


<form id="editTradeForm">


<label>

    Date

    <input
        id="tradeDate"
        type="date"
        required
    >

</label>


<label>

    Symbol

    <input
        id="symbol"
        required
    >

</label>


<label>

    Direction

    <select id="direction">

        <option>BUY</option>
        <option>SELL</option>

    </select>

</label>


<label>

    Entry

    <input
        id="entry"
        type="number"
        step="any"
    >

</label>


<label>

    Stop Loss

    <input
        id="stopLoss"
        type="number"
        step="any"
    >

</label>


<label>

    Take Profit

    <input
        id="takeProfit"
        type="number"
        step="any"
    >

</label>


<label>

    Exit Price

    <input
        id="exitPrice"
        type="number"
        step="any"
    >

</label>


<label>

    Lot Size

    <input
        id="lotSize"
        type="number"
        step="any"
    >

</label>


<label>

    Risk %

    <input
        id="riskPercent"
        type="number"
        step="0.01"
    >

</label>


<label>

    Profit / Loss ($)

    <input
        id="profitLoss"
        type="number"
        step="0.01"
    >

</label>


<label>

    Session

    <select id="session">

        <option>Asian</option>
        <option>London</option>
        <option>New York</option>

    </select>

</label>


<label>

    Setup

    <select id="setup">

        <option>Liquidity Sweep</option>
        <option>CHOCH</option>
        <option>BOS</option>
        <option>Session AMD</option>
        <option>Breakout</option>

    </select>

</label>


<label>

    Result

    <select id="result">

        <option>Win</option>
        <option>Loss</option>
        <option>BE</option>

    </select>

</label>


<label class="full">

    Mistakes

    <input id="mistakes">

</label>


<label class="full">

    Notes

    <textarea
        id="notes"
        rows="5"
    ></textarea>

</label>


<div
    id="screenshots"
    class="full"
></div>


<button
    class="full"
    type="submit"
>
    Update Trade
</button>


<p
    id="message"
    class="full"
></p>


</form>


</main>


<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    requireLogin();
</script>

<script src="js/edit-trade.js"></script>
<script src="js/navigation.js"></script>
<script src="js/pwa.js"></script>
</body>

</html>
