<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Trade</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#161b22"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header class="main-header">

    <div class="brand">

        <a
            href="index.html"
            class="brand-link"
        >

            <h1>
                Trading Journal
            </h1>

        </a>

        <span class="subtitle">
            Add Trade
        </span>

    </div>


    <div class="header-actions">

        <a
            href="index.html"
            class="add-trade-button"
        >
            Dashboard
        </a>

        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<nav class="main-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>

</nav>


<main>

<form id="tradeForm">


    <label>

        Account

        <select
            id="account"
            required
        >

            <option>
                Loading...
            </option>

        </select>

    </label>


    <label>

        Date

        <input
            id="tradeDate"
            type="date"
            required
        >

    </label>


    <label>

        Symbol

        <input
            id="symbol"
            value="XAUUSD"
            required
        >

    </label>


    <label>

        Direction

        <select id="direction">

            <option value="BUY">
                BUY
            </option>

            <option value="SELL">
                SELL
            </option>

        </select>

    </label>


    <label>

        Stop Loss

        <input
            id="stopLoss"
            type="number"
            step="any"
            required
        >

    </label>


    <label>

        Take Profit

        <input
            id="takeProfit"
            type="number"
            step="any"
        >

    </label>


    <label>

        Contract Size

        <input
            id="contractSize"
            type="number"
            step="any"
            value="100"
        >

    </label>


    <label>

        Risk %

        <input
            id="riskPercent"
            type="number"
            step="0.01"
            value="1"
        >

    </label>


    <label>

        Session

        <select id="session">

            <option>
                Asian
            </option>

            <option>
                London
            </option>

            <option>
                New York
            </option>

        </select>

    </label>


    <label>

        Setup

        <select id="setup">

            <option>
                Liquidity Sweep
            </option>

            <option>
                CHOCH
            </option>

            <option>
                BOS
            </option>

            <option>
                Session AMD
            </option>

            <option>
                Breakout
            </option>

            <option>
                Other
            </option>

        </select>

    </label>


    <label>

        Trade Status

        <select id="tradeStatus">

            <option value="OPEN">
                OPEN
            </option>

            <option value="PARTIAL">
                PARTIAL
            </option>

            <option value="CLOSED">
                CLOSED
            </option>

        </select>

    </label>


    <label>

        Rules Followed?

        <select id="rulesFollowed">

            <option value="true">
                Yes
            </option>

            <option value="false">
                No
            </option>

        </select>

    </label>



    <!-- ENTRY LAYERS -->

    <div class="full layer-section">

        <div class="layer-heading">

            <h3>
                Entry Layers
            </h3>

            <button
                type="button"
                id="addEntryLayer"
                class="layer-add-button"
            >
                + Add Entry
            </button>

        </div>


        <div id="entryLayers">

            <div class="layer-row entry-layer">

                <label>

                    Entry Price

                    <input
                        class="layer-entry-price"
                        type="number"
                        step="any"
                        required
                    >

                </label>


                <label>

                    Lot Size

                    <input
                        class="layer-entry-lot"
                        type="number"
                        step="0.01"
                        required
                    >

                </label>


                <button
                    type="button"
                    class="remove-layer"
                >
                    ×
                </button>

            </div>

        </div>

    </div>



    <!-- EXIT LAYERS -->

    <div class="full layer-section">

        <div class="layer-heading">

            <h3>
                Exit Layers
            </h3>

            <button
                type="button"
                id="addExitLayer"
                class="layer-add-button"
            >
                + Add Exit
            </button>

        </div>


        <div id="exitLayers">

            <div class="layer-row exit-layer">

                <label>

                    Exit Price

                    <input
                        class="layer-exit-price"
                        type="number"
                        step="any"
                    >

                </label>


                <label>

                    Lot Size

                    <input
                        class="layer-exit-lot"
                        type="number"
                        step="0.01"
                    >

                </label>


                <button
                    type="button"
                    class="remove-layer"
                >
                    ×
                </button>

            </div>

        </div>

    </div>



    <!-- CALCULATIONS -->

    <div class="trade-calculations full">

        <div>
            <span>Total Entry Lots</span>
            <strong id="totalEntryLots">
                0.00
            </strong>
        </div>


        <div>
            <span>Total Exit Lots</span>
            <strong id="totalExitLots">
                0.00
            </strong>
        </div>


        <div>
            <span>Remaining Lots</span>
            <strong id="remainingLots">
                0.00
            </strong>
        </div>


        <div>
            <span>Average Entry</span>
            <strong id="averageEntry">
                -
            </strong>
        </div>


        <div>
            <span>Average Exit</span>
            <strong id="averageExit">
                -
            </strong>
        </div>


        <div>
            <span>Planned Risk</span>
            <strong id="plannedRisk">
                $0.00
            </strong>
        </div>


        <div>
            <span>Planned RR</span>
            <strong id="plannedRR">
                0.00R
            </strong>
        </div>


        <div>
            <span>Actual P&L</span>
            <strong id="calculatedPnL">
                $0.00
            </strong>
        </div>


        <div>
            <span>Actual R</span>
            <strong id="actualRR">
                0.00R
            </strong>
        </div>

    </div>



    <label class="full">

        Mistakes

        <input
            id="mistakes"
            placeholder="FOMO, late entry, over-risk..."
        >

    </label>


    <label class="full">

        Notes

        <textarea
            id="notes"
            rows="5"
        ></textarea>

    </label>



    <label class="full">

        Before Trade Screenshot

        <input
            id="beforeScreenshot"
            type="file"
            accept="image/*"
        >

    </label>


    <label class="full">

        After Trade Screenshot

        <input
            id="afterScreenshot"
            type="file"
            accept="image/*"
        >

    </label>



    <button
        type="submit"
        class="full"
    >
        Save Trade
    </button>


    <p
        id="message"
        class="full"
    ></p>


</form>

</main>


<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>
    requireLogin();
</script>

<script src="js/navigation.js"></script>

<script src="js/add-trade.js"></script>

<script src="js/pwa.js"></script>


</body>

</html>
