<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set New Password</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>

<div class="login-page">

    <div class="login-card">

        <h1>
            New Password
        </h1>

        <p class="subtitle">
            Enter your new password below.
        </p>


        <form id="updatePasswordForm">

            <label>

                New Password

                <input
                    id="newPassword"
                    type="password"
                    minlength="8"
                    required
                >

            </label>


            <label>

                Confirm Password

                <input
                    id="confirmPassword"
                    type="password"
                    minlength="8"
                    required
                >

            </label>


            <button type="submit">
                Update Password
            </button>

        </form>


        <p id="passwordMessage"></p>

    </div>

</div>


<script src="js/config.js"></script>

<script src="js/update-password.js"></script>

</body>

</html>
