<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#161b22">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Trading Journal">

    <title>Trading Analytics</title>

    <link rel="stylesheet" href="css/style.css">
    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="main-header">

    <div class="brand">

        <a
            href="index.html"
            class="brand-link"
        >

            <h1>
                Trading Journal
            </h1>

        </a>

        <span class="subtitle">
            Performance & Risk Dashboard
        </span>

    </div>


    <div class="header-actions">

        <a
            href="add-trade.html"
            class="add-trade-button"
        >
            + Add Trade
        </a>

        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<nav class="main-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>

</nav>
<header>


<main>

    <!-- ACCOUNT FILTER -->

    <section class="dashboard-account">

        <label>
            Trading Account

            <select id="analyticsAccount">
                <option>Loading...</option>
            </select>
        </label>

    </section>


    <!-- SUMMARY -->

    <section class="stats-grid">

        <div class="stat-card">
            <span>Net P&L</span>
            <strong id="analyticsPnL">$0.00</strong>
        </div>

        <div class="stat-card">
            <span>Win Rate</span>
            <strong id="analyticsWinRate">0%</strong>
        </div>

        <div class="stat-card">
            <span>Average R</span>
            <strong id="analyticsAverageR">0.00R</strong>
        </div>

        <div class="stat-card">
            <span>Best Session</span>
            <strong id="bestSession">-</strong>
        </div>

        <div class="stat-card">
            <span>Best Setup</span>
            <strong id="bestSetup">-</strong>
        </div>

        <div class="stat-card">
            <span>Total Trades</span>
            <strong id="analyticsTrades">0</strong>
        </div>

    </section>


    <!-- EQUITY CURVE -->

    <section class="chart-card">

        <h2>Equity Curve</h2>

        <div class="chart-container">
            <canvas id="equityChart"></canvas>
        </div>

    </section>


    <!-- SESSION -->

    <section class="chart-card">

        <h2>P&L by Session</h2>

        <div class="chart-container">
            <canvas id="sessionChart"></canvas>
        </div>

    </section>


    <!-- TWO COLUMN CHARTS -->

    <section class="analytics-grid">

        <div class="chart-card">

            <h2>Win Rate by Setup</h2>

            <div class="chart-container">
                <canvas id="setupChart"></canvas>
            </div>

        </div>


        <div class="chart-card">

            <h2>P&L by Weekday</h2>

            <div class="chart-container">
                <canvas id="weekdayChart"></canvas>
            </div>

        </div>

    </section>

</main>


<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    requireLogin();
</script>
<script src="js/analytics.js"></script>
<script src="js/navigation.js"></script>
<script src="js/pwa.js"></script>

</body>

</html>
