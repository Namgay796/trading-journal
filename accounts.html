<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trading Accounts</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
</head>

<body>

<header class="main-header">

    <div class="brand">

        <h1>Trading Journal</h1>

        <span class="subtitle">
            Performance & Risk Dashboard
        </span>

    </div>


    <div class="header-actions">

        <a
            href="add-trade.html"
            class="add-trade-button"
        >
            + Add Trade
        </a>

        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<nav class="desktop-nav">

    <a
        href="index.html"
        class="active"
    >
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        Trade History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>

</nav>
<header>


<main>

    <!-- ADD ACCOUNT -->

    <section class="dashboard-section">

        <h2>Add Account</h2>

        <form id="accountForm">

            <label>
                Account Name

                <input
                    id="accountName"
                    placeholder="100K Funded"
                    required
                >
            </label>


            <label>
                Prop Firm / Broker

                <input
                    id="firm"
                    placeholder="FTMO"
                >
            </label>


            <label>
                Account Type

                <select id="accountType">

                    <option>Funded</option>
                    <option>Challenge</option>
                    <option>Personal</option>
                    <option>Demo</option>

                </select>
            </label>


            <label>
                Starting Balance

                <input
                    id="startingBalance"
                    type="number"
                    step="0.01"
                    placeholder="100000"
                    required
                >
            </label>


            <label>
                Profit Target %

                <input
                    id="profitTarget"
                    type="number"
                    step="0.01"
                    value="10"
                >
            </label>


            <label>
                Daily Loss Limit %

                <input
                    id="dailyLossLimit"
                    type="number"
                    step="0.01"
                    value="5"
                >
            </label>


            <label>
                Maximum Loss %

                <input
                    id="maxLossLimit"
                    type="number"
                    step="0.01"
                    value="10"
                >
            </label>


            <label>
                Consistency Rule %

                <input
                    id="consistencyRule"
                    type="number"
                    step="0.01"
                    value="0"
                >
            </label>


            <label>
                Status

                <select id="accountStatus">

                    <option>Active</option>
                    <option>Passed</option>
                    <option>Failed</option>
                    <option>Paused</option>

                </select>
            </label>


            <button
                type="submit"
                class="full"
            >
                Add Account
            </button>


            <p
                id="accountMessage"
                class="full"
            ></p>

        </form>

    </section>


    <br>


    <!-- EXISTING ACCOUNTS -->

    <section class="dashboard-section">

        <div class="section-header">

            <h2>My Accounts</h2>

            <span id="accountCount">
                0 accounts
            </span>

        </div>


        <div id="accountsList">

            Loading accounts...

        </div>

    </section>

</main>


<nav class="mobile-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        + Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

</nav>


<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    requireLogin();
</script>
<script src="js/accounts.js"></script>
<script src="js/navigation.js"></script>

</body>

</html>
