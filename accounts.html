<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trading Accounts</title>


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- PWA -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#161b22"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Trading Journal"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="main-header">

    <div class="brand">

        <a
            href="index.html"
            class="brand-link"
        >

            <h1>
                Trading Journal
            </h1>

        </a>


        <span class="subtitle">
            Trading Accounts
        </span>

    </div>


    <div class="header-actions">

        <a
            href="add-trade.html"
            class="add-trade-button"
        >
            + Add Trade
        </a>


        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<!-- =========================================
     NAVIGATION
========================================= -->

<nav class="main-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>
    <a href="risk-calculator.html">
    Risk Calculator
</a>

</nav>


<main>


    <!-- =========================================
         ADD / EDIT ACCOUNT
    ========================================= -->

    <section class="dashboard-section">

        <div class="section-header">

            <h2 id="accountFormTitle">
                Add Trading Account
            </h2>

        </div>


        <form id="accountForm">


            <!-- Hidden ID used when editing -->

            <input
                type="hidden"
                id="accountId"
            >


            <!-- ACCOUNT NAME -->

            <label>

                Account Name

                <input
                    id="accountName"
                    type="text"
                    placeholder="Example: 25K Funded"
                    required
                >

            </label>


            <!-- STARTING BALANCE -->

            <label>

                Initial Balance ($)

                <input
                    id="startingBalance"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="25000"
                    required
                >

            </label>


            <!-- PROFIT TARGET -->

            <label>

                Profit Target (%)

                <input
                    id="profitTarget"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="10"
                >

            </label>


            <!-- DAILY LOSS -->

            <label>

                Daily Loss Limit (%)

                <input
                    id="dailyLossLimit"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="3"
                >

            </label>


            <!-- MAX LOSS -->

            <label>

                Maximum Loss Limit (%)

                <input
                    id="maxLossLimit"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="6"
                >

            </label>


            <!-- CONSISTENCY -->

            <label>

                Consistency Rule (%)

                <input
                    id="consistencyLimit"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="20"
                >

            </label>


            <!-- STATUS -->

            <label>

                Status

                <select id="accountStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Challenge">
                        Challenge
                    </option>

                    <option value="Funded">
                        Funded
                    </option>

                    <option value="Passed">
                        Passed
                    </option>

                    <option value="Breached">
                        Breached
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </label>


            <!-- =========================================
                 LEVERAGE
            ========================================= -->

            <div class="full">

                <h3 style="margin-bottom: 5px;">
                    Leverage
                </h3>

                <small style="color:#8b949e;">
                    Enter only the leverage number.
                    Example: enter 20 for 1:20.
                </small>

            </div>


            <!-- METALS -->

            <label>

                Metals Leverage

                <input
                    id="leverageMetals"
                    type="number"
                    step="1"
                    min="1"
                    value="20"
                    required
                >

            </label>


            <!-- FOREX -->

            <label>

                Forex Leverage

                <input
                    id="leverageForex"
                    type="number"
                    step="1"
                    min="1"
                    value="30"
                    required
                >

            </label>


            <!-- INDICES -->

            <label>

                Indices Leverage

                <input
                    id="leverageIndices"
                    type="number"
                    step="1"
                    min="1"
                    value="20"
                    required
                >

            </label>


            <!-- CRYPTO -->

            <label>

                Crypto Leverage

                <input
                    id="leverageCrypto"
                    type="number"
                    step="1"
                    min="1"
                    value="2"
                    required
                >

            </label>


            <!-- BUTTONS -->

            <div
                class="full"
                style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                "
            >

                <button
                    type="submit"
                    id="saveAccountButton"
                >
                    Save Account
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    style="
                        background:#30363d;
                        display:none;
                    "
                >
                    Cancel Edit
                </button>

            </div>


            <p
                id="accountMessage"
                class="full"
            ></p>


        </form>

    </section>



    <!-- =========================================
         ACCOUNT LIST
    ========================================= -->

    <section
        class="dashboard-section"
        style="margin-top:20px;"
    >

        <div class="section-header">

            <h2>
                My Trading Accounts
            </h2>

        </div>


        <div id="accountsList">

            <p>
                Loading accounts...
            </p>

        </div>

    </section>


</main>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/config.js"></script>

<script src="js/auth.js"></script>


<script>

    requireLogin();

</script>


<script src="js/navigation.js"></script>

<script src="js/accounts.js"></script>

<script src="js/pwa.js"></script>


</body>

</html>
