<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trading Journal Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">

    <section class="login-card">

        <h1>
            Trading Journal
        </h1>

        <p class="subtitle">
            Sign in to your journal
        </p>


        <form id="loginForm">

            <label>

                Email

                <input
                    id="email"
                    type="email"
                    required
                >

            </label>


            <label>

                Password

                <input
                    id="password"
                    type="password"
                    required
                >

            </label>


            <button
                type="submit"
                class="full"
            >
                Sign In
            </button>
            <p class="auth-switch">

    Don't have an account?

    <a href="signup.html">
        Create Account
    </a>

</p>


            <p
                id="loginMessage"
                class="full"
            ></p>

        </form>

    </section>

</main>


<script src="js/config.js"></script>
<script src="js/login.js"></script>


</body>

</html>
