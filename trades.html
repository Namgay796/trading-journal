<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#161b22">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Trading Journal">

    <title>Trade History</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header class="main-header">

    <div class="brand">

        <a
            href="index.html"
            class="brand-link"
        >

            <h1>
                Trading Journal
            </h1>

        </a>

        <span class="subtitle">
            Performance & Risk Dashboard
        </span>

    </div>


    <div class="header-actions">

        <a
            href="add-trade.html"
            class="add-trade-button"
        >
            + Add Trade
        </a>

        <button
            type="button"
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </div>

</header>


<nav class="main-nav">

    <a href="index.html">
        Dashboard
    </a>

    <a href="add-trade.html">
        Add Trade
    </a>

    <a href="trades.html">
        History
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="calendar.html">
        Calendar
    </a>

    <a href="accounts.html">
        Accounts
    </a>

</nav>
<header>


<main>


<section class="history-filters">

    <select id="sessionFilter">

        <option value="">
            All Sessions
        </option>

        <option>
            Asian
        </option>

        <option>
            London
        </option>

        <option>
            New York
        </option>

    </select>


    <select id="resultFilter">

        <option value="">
            All Results
        </option>

        <option>
            Win
        </option>

        <option>
            Loss
        </option>

        <option>
            BE
        </option>

    </select>


    <input
        id="symbolFilter"
        placeholder="Search symbol..."
    >

</section>



<section class="history-container">

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Symbol</th>

                    <th>Side</th>

                    <th>Session</th>

                    <th>Setup</th>

                    <th>Result</th>

                    <th>P&L</th>

                    <th>R</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="tradeTable">

            </tbody>

        </table>

    </div>

</section>


</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    requireLogin();
</script>

<script src="js/trades.js"></script>
<script src="js/navigation.js"></script>
<script src="js/pwa.js"></script>

</body>

</html>
